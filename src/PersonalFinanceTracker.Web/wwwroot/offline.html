<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#173b35">
  <title>Offline · Finance Tracker</title>
  <style>
    :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; color: #183b35; background: #f5f7f4; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
    main { width: min(100%, 420px); padding: 36px; box-sizing: border-box; border: 1px solid #e1e9e3; border-radius: 24px; background: white; box-shadow: 0 18px 48px #183b3510; }
    .mark { width: 48px; height: 48px; display: grid; place-items: center; border-radius: 15px; color: white; background: #173b35; font-size: 24px; font-weight: 750; }
    h1 { margin: 28px 0 10px; font-size: 26px; letter-spacing: -.04em; }
    p { margin: 0; color: #62746d; line-height: 1.6; }
    button { margin-top: 24px; padding: 12px 18px; border: 0; border-radius: 12px; color: white; background: #173b35; font: inherit; font-weight: 650; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">P</div>
    <h1>You’re offline</h1>
    <p>Your expense tracker needs a connection to your computer to load your expenses. Reconnect to the same network, then try again.</p>
    <button onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
